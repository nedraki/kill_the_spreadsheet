[project]
name = "better-than-spreadsheets"
version = "0.2.0"
description = "Deterministic Excel cleaning with exact BigQuery exports and row quarantine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.2,<3",
    "streamlit>=1.50.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']
